<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TkLudo — শীঘ্রই আসছে</title>
  <!-- Placeholder until the first APK is published. Replace this folder
       with a redirect to the APK once the VPS backend is live. -->
  <style>
    :root { --bg-top: #1F1338; --bg-bottom: #3D2666; --text: #F3ECFF; --muted: #B9A8D8; --gold: #FFC83D; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)); color: var(--text); text-align: center;
    }
    main { max-width: 420px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    h1 span { color: var(--gold); }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 28px; border-radius: 999px; background: var(--gold);
        color: #1F1338; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Tk<span>Ludo</span></h1>
    <p>অ্যাপ ডাউনলোড শীঘ্রই চালু হবে।<br>App download is coming soon.</p>
    <a href="/">হোমে ফিরুন</a>
  </main>
</body>
</html>
